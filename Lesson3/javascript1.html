<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Basics - Alert & Prompt</title>
</head>
<body>

    <script>
        // 1. Show a simple pop-up alert
        alert("Welcome to our JavaScript class!");

        // 2. Ask the user for their name
        let userName = prompt("What is your name?");

        // 3. Write the answer directly onto the web page
        document.write("<h1>Hello, " + userName + "! Welcome to JavaScript.</h1>");
    </script>

</body>
</html>
